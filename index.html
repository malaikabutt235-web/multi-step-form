<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="form-card">

        <h1>Multi-Step Form</h1>
        <p>Complete the form step by step</p>

        <div class="progress-container">
            <div class="progress-info">
                <span id="stepText">Step 1 of 4</span>
                <span id="percentage">25%</span>
            </div>

            <div class="progress-track">
                <div id="progressBar"></div>
            </div>
        </div>

        <form id="form">

            <!-- STEP 1 -->
            <div class="step active">
                <h2>Personal Information</h2>

                <label>Full Name *</label>
                <input type="text" id="name" placeholder="Enter your full name">
                <small id="nameError"></small>

                <label>Email *</label>
                <input type="email" id="email" placeholder="Enter your email">
                <small id="emailError"></small>
            </div>

            <!-- STEP 2 -->
            <div class="step">
                <h2>Contact Information</h2>

                <label>Phone Number *</label>
                <input type="text" id="phone" placeholder="Enter your phone number">
                <small id="phoneError"></small>

                <label>City *</label>
                <input type="text" id="city" placeholder="Enter your city">
                <small id="cityError"></small>
            </div>

            <!-- STEP 3 -->
            <div class="step">
                <h2>Additional Details</h2>

                <label>Subject *</label>
                <select id="subject">
                    <option value="">Select a subject</option>
                    <option>Web Development</option>
                    <option>JavaScript</option>
                    <option>Internship</option>
                    <option>Other</option>
                </select>
                <small id="subjectError"></small>

                <label>Message *</label>
                <textarea id="message" placeholder="Write your message"></textarea>
                <small id="messageError"></small>
            </div>

            <!-- STEP 4 -->
            <div class="step">
                <h2>Final Summary</h2>

                <p>Please check your information before submission.</p>

                <div id="summary"></div>

                <p id="success"></p>
            </div>

            <div class="buttons">
                <button type="button" id="previous">Previous</button>
                <button type="button" id="next">Next</button>
            </div>

        </form>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
